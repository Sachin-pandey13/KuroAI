name: KuroAI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    name: Validate, Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Architecture Validator
        run: python scripts/architecture_validator.py

      - name: Run Public API Stability Tests
        run: python -m pytest tests/test_public_api.py -v

      - name: Run Unit Test Suite
        run: python -m pytest tests/ -q --ignore=tests/stress

      - name: Run Security Tests
        run: python -m pytest tests/test_security.py tests/test_resilience.py tests/test_telemetry.py -v

      - name: Generate Coverage Report
        run: |
          pip install coverage
          coverage run -m pytest tests/ --ignore=tests/stress -q
          coverage report --fail-under=70
          coverage html -d coverage_html

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_html/
