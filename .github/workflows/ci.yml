name: KuroAI CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  OPENAI_API_KEY: "test-mock-key-for-ci"
  ANTHROPIC_API_KEY: "test-mock-key-for-ci"
  GEMINI_API_KEY: "test-mock-key-for-ci"

jobs:
  architecture:
    name: Architecture & Import Graph Validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements/ci.txt
      - run: python -c "import backend; import backend.agents; import backend.capabilities; import backend.engine"
      - run: python scripts/architecture_validator.py

  formatting:
    name: Code Formatting (Black & isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements/ci.txt
      - run: black --check backend config scripts tests benchmarks
      - run: isort --check-only backend config scripts tests benchmarks

  linting:
    name: Linting (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements/ci.txt
      - run: ruff check backend config scripts tests benchmarks

  type-checking:
    name: Type Checking (MyPy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements/ci.txt
      - run: mypy backend config --ignore-missing-imports

  test-collection:
    name: Test Collection Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements/ci.txt
      - run: python -m pytest --collect-only -q

  unit-tests:
    name: Unit Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [architecture, formatting, linting, type-checking, test-collection]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements/ci.txt
      - run: python -m pytest tests/test_public_api.py -v
      - run: python -m pytest tests/ -q --ignore=tests/stress

  security:
    name: Security Audits & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements/ci.txt
      - run: python -m pytest tests/test_security.py -v
      - run: pip-audit || echo "Security audit finished with non-zero status"

  coverage:
    name: Layer Coverage Enforcement
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements/ci.txt
      - run: coverage run -m pytest tests/ --ignore=tests/stress -q
      - run: coverage report --fail-under=80
      - run: coverage html -d coverage_html
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_html/
