version: "3.9"

# ────────────────────────────────────────────────────────────
# KuroAI GPU-Accelerated Compose
# Passes host NVIDIA GPU to container for local ML inference.
# ────────────────────────────────────────────────────────────

services:
  kuroai-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: kuroai:gpu
    container_name: kuroai-api-gpu
    env_file:
      - .env
    environment:
      - KUROAI_ENV=production
      - LOG_LEVEL=INFO
      - CUDA_VISIBLE_DEVICES=0
    ports:
      - "8000:8000"
    volumes:
      - kuroai-outputs:/app/outputs
      - kuroai-data:/app/data
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: uvicorn backend.api.app:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  kuroai-outputs:
  kuroai-data:
