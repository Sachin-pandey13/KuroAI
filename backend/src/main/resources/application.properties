spring.application.name=backend
server.port=8080

# H2 In-Memory Database Configuration for Zero-Setup Local Dev
spring.datasource.url=jdbc:h2:mem:kuroaidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Enable H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Secret Key (should be in env vars for production)
kuroai.app.jwtSecret=======================KuroAISecretKeyForJWTGenerationMustBeAtLeast256Bits===========================
kuroai.app.jwtExpirationMs=86400000

# Proxy config for FastAPI AI generation
kuroai.app.fastApiUrl=http://localhost:8000

# Logging Configuration
logging.level.org.springframework.security=DEBUG
