version: "3.9"

# ────────────────────────────────────────────────────────────
# KuroAI Development Compose
# Hot-reloads on source changes. Uses .env for secrets.
# ────────────────────────────────────────────────────────────

services:
  kuroai-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: kuroai:dev
    container_name: kuroai-api-dev
    env_file:
      - .env
    environment:
      - KUROAI_ENV=development
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot-reload in development
      - ./backend:/app/backend
      - ./config:/app/config
      - ./outputs:/app/outputs
      - ./data:/app/data
    command: uvicorn backend.api.app:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
