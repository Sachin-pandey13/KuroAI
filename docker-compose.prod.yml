version: "3.9"

# ────────────────────────────────────────────────────────────
# KuroAI Production Compose
# No source mounts. Read-only secrets. Multi-worker uvicorn.
# ────────────────────────────────────────────────────────────

services:
  kuroai-api:
    image: kuroai:latest
    container_name: kuroai-api-prod
    env_file:
      - .env
    environment:
      - KUROAI_ENV=production
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - kuroai-outputs:/app/outputs
      - kuroai-data:/app/data
    command: >
      uvicorn backend.api.app:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --log-level info
      --no-access-log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  kuroai-outputs:
  kuroai-data:
